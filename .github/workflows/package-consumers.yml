name: Package Consumers

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  cmake-consumers:
    name: CMake consumers (${{ matrix.sqlite }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        sqlite: [external, bundled]
    env:
      CC: gcc-13
      CXX: g++-13

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl gcc-13 g++-13 ninja-build

      - name: Install system SQLite
        if: matrix.sqlite == 'external'
        run: |
          sudo apt-get install -y libsqlite3-dev

      - name: Build and install vsqlitepp
        run: |
          cmake -S . -B build/install-${{ matrix.sqlite }} -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="${RUNNER_TEMP}/vsqlitepp-install-${{ matrix.sqlite }}" \
            -DVSQLITE_BUILD_EXAMPLES=OFF \
            -DVSQLITE_BUILD_TESTS=OFF \
            -DVSQLITE_BUNDLED_SQLITE=${{ matrix.sqlite == 'bundled' && 'ON' || 'OFF' }}
          cmake --build build/install-${{ matrix.sqlite }}
          cmake --install build/install-${{ matrix.sqlite }}

      - name: Test installed package consumer
        run: |
          cmake -S tests/package_consumers/install -B build/consumer-install-${{ matrix.sqlite }} -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="${RUNNER_TEMP}/vsqlitepp-install-${{ matrix.sqlite }}"
          cmake --build build/consumer-install-${{ matrix.sqlite }}
          ./build/consumer-install-${{ matrix.sqlite }}/vsqlitepp_install_consumer

      - name: Test installed package public headers
        run: |
          cmake -S tests/package_consumers/headers -B build/consumer-headers-${{ matrix.sqlite }} -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="${RUNNER_TEMP}/vsqlitepp-install-${{ matrix.sqlite }}"
          cmake --build build/consumer-headers-${{ matrix.sqlite }}
          ctest --test-dir build/consumer-headers-${{ matrix.sqlite }} --output-on-failure

      - name: Test FetchContent consumer
        run: |
          cmake -S tests/package_consumers/fetchcontent -B build/consumer-fetchcontent-${{ matrix.sqlite }} -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DVSQLITEPP_SOURCE_DIR="${GITHUB_WORKSPACE}" \
            -DVSQLITE_BUILD_EXAMPLES=OFF \
            -DVSQLITE_BUILD_TESTS=OFF \
            -DVSQLITE_BUNDLED_SQLITE=${{ matrix.sqlite == 'bundled' && 'ON' || 'OFF' }}
          cmake --build build/consumer-fetchcontent-${{ matrix.sqlite }}
          ./build/consumer-fetchcontent-${{ matrix.sqlite }}/vsqlitepp_fetchcontent_consumer

      - name: Test CPM.cmake consumer
        run: |
          mkdir -p "${RUNNER_TEMP}/cpm"
          curl -fsSL https://github.com/cpm-cmake/CPM.cmake/releases/latest/download/CPM.cmake \
            -o "${RUNNER_TEMP}/cpm/CPM.cmake"
          cmake -S tests/package_consumers/cpm -B build/consumer-cpm-${{ matrix.sqlite }} -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCPM_SOURCE_CACHE="${RUNNER_TEMP}/cpm" \
            -DVSQLITEPP_SOURCE_DIR="${GITHUB_WORKSPACE}" \
            -DVSQLITE_BUILD_EXAMPLES=OFF \
            -DVSQLITE_BUILD_TESTS=OFF \
            -DVSQLITE_BUNDLED_SQLITE=${{ matrix.sqlite == 'bundled' && 'ON' || 'OFF' }}
          cmake --build build/consumer-cpm-${{ matrix.sqlite }}
          ./build/consumer-cpm-${{ matrix.sqlite }}/vsqlitepp_cpm_consumer
